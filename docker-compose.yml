name: profilaxia

services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    restart: unless-stopped
    environment:
      MODEL_PATH: /app/data/processed/modelo_mlp_profilaxia.pkl
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://localhost:8080
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data/processed:/app/data/processed:ro
      - hf_cache:/models/hf
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  # Build de produção: docker compose --profile prod up --build backend-prod frontend-prod
  backend-prod:
    profiles: [prod]
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      MODEL_PATH: /app/data/processed/modelo_mlp_profilaxia.pkl
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./data/processed:/app/data/processed:ro
      - hf_cache_prod:/models/hf
    networks:
      internal:
        aliases: [backend]

  frontend-prod:
    profiles: [prod]
    build:
      context: ./frontend
      target: prod
    ports:
      - "8080:80"
    depends_on: [backend-prod]
    networks: [internal]

networks:
  internal:

volumes:
  hf_cache:
  hf_cache_prod:
  frontend_node_modules:
